[project]
name = "bimbaka"
version = "1.0.0"
description = "Bimbaka - Aplikasi Pembelajaran dan Bimbingan Belajar Interaktif Berbasis Django"
requires-python = ">=3.12"

[tool.djlint]
indent = 2

[tool.black]
line-length = 88
include = "(\\.pyi?|\\.ipynb)$"
exclude = "/(\\.git|\\.hg|\\.mypy_cache|\\.nox|\\.tox|\\.venv|_build|buck-out|build|dist)/"
