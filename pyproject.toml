[project]
name = "bimbaka"
version = "1.0.0"
description = "Bimbaka - Aplikasi Pembelajaran dan Bimbingan Belajar Interaktif Berbasis Django"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [
  { name = "Fika Qoshdina", email = "qoshdinafika@gmail.com" }
]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Intended Audience :: Education",
  "Topic :: Education",
]

[tool.djlint]
indent = 2

[tool.black]
line-length = 88
include = "(\\.pyi?|\\.ipynb)$"
exclude = "/(\\.git|\\.hg|\\.mypy_cache|\\.nox|\\.tox|\\.venv|_build|buck-out|build|dist)/"
